    <line x1="40" y1="28" x2="40" y2="100"/>
    <path d="M40 60 C40 80, 88 68, 88 88"/>
  </g>
  <circle cx="40" cy="28" r="9" fill="#ffffff"/>
  <circle cx="40" cy="100" r="9" fill="#ffffff"/>
  <circle cx="88" cy="88" r="9" fill="#ffffff"/>
  <circle cx="88" cy="88" r="4" fill="#1d4ed8"/>
  <circle cx="40" cy="28" r="4" fill="#1d4ed8"/>
  <circle cx="40" cy="100" r="4" fill="#1d4ed8"/>
</svg>
