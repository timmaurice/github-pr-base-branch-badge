name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify tag matches manifest.json version
        run: |
          MANIFEST_VERSION="v$(node -p "require('./manifest.json').version")"
          if [ "$MANIFEST_VERSION" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match manifest.json version ($MANIFEST_VERSION) — bump manifest.json's \"version\" to match before tagging."
            exit 1
          fi

      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      - run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/*.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes
